name: arXiv-daily

on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Run script
        run: |
          source .venv/bin/activate
          export OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          export OPENAI_BASE_URL=${{ secrets.OPENAI_BASE_URL }}
          export LANGUAGE="${{ vars.LANGUAGE }}"
          export CATEGORIES="${{ vars.CATEGORIES }}"
          export MODEL_NAME="${{ vars.MODEL_NAME }}"
          bash run.sh

      - name: Configure Git
        run: |
          git config user.email "${{ vars.EMAIL || 'github-actions[bot]@users.noreply.github.com' }}"
          git config user.name "${{ vars.NAME || 'github-actions[bot]' }}"

      - name: Commit changes
        run: |
          git add .
          # 只有在有实际修改时才提交，避免空提交
          git diff --staged --quiet || git commit -m "Automated update by workflow"

      - name: Push changes
        run: |
          git pull --rebase origin main
          git push origin main